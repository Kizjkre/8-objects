<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    <script src="script.js" defer type="module"></script>
    <title>Life Events</title>
  </head>
  <body>
    <div id="timeline">
      <div id="playhead"></div>
      <div id="percent-container">
        <p id="percent">0.0%</p>
      </div>
      <div class="ticon" id="tchestnut"></div>
      <div class="ticon" id="tpencil"></div>
      <div class="ticon" id="tcoin"></div>
      <div class="ticon" id="trock"></div>
      <div class="ticon" id="tmatchbox"></div>
      <div class="ticon" id="tvelcro"></div>
      <div class="ticon" id="tpaper"></div>
      <div class="ticon" id="tstick"></div>
    </div>
    <button class="sample" id="rock">
      <model-viewer oncontextmenu="return false;" class="w-full h-full" src="assets/rock/model.glb"
                    alt="Stone by Poly by Google [CC-BY] via Poly Pizza"
                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""
                    ar-status="not-presenting">
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <span>Stone by Poly by Google [CC-BY] via Poly Pizza</span>
    </button>
    <button class="sample" id="pencil">
      <model-viewer oncontextmenu="return false;" class="w-full h-full" src="assets/pencil/model.glb"
                    alt="Pencil by Poly by Google [CC-BY] via Poly Pizza"
                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""
                    ar-status="not-presenting">
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <span>Pencil by Poly by Google [CC-BY] via Poly Pizza</span>
    </button>
    <button class="sample" id="coin">
      <model-viewer oncontextmenu="return false;" class="w-full h-full" src="assets/coin/model.glb"
                    alt="Coin by Quaternius"
                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""
                    ar-status="not-presenting">
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <span>Coin by Quaternius</span>
    </button>
    <button class="sample" id="stick">

                    alt="Stick by Chris Lee [CC-BY] via Poly Pizza"
                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""

          <div class="update-bar"></div>

    <button class="sample" id="velcro">

                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""
                    ar-status="not-presenting">
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <span>Time Hotel 5.25 Painters Tape by S. Paul Michael [CC-BY] via Poly Pizza</span>
    </button>
    <button class="sample" id="paper">
      <model-viewer oncontextmenu="return false;" class="w-full h-full" src="assets/paper/model.glb"
                    alt="Small Stack of Paper by Jarlan Perez [CC-BY] via Poly Pizza"
                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"

                    auto-rotate="true" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""

      <model-viewer oncontextmenu="return false;" class="w-full h-full" src="assets/matchbox/model.glb"
                    alt="matchbox open by Justin Randall [CC-BY] via Poly Pizza"
                    auto-rotate="true" orientation="45deg 0deg 135deg" shadow-intensity="1" interaction-prompt="false"
                    loading="eager" camera-orbit="0.87089rad 1.31884rad 110%m"
                    enable-pan="true" field-of-view="42deg" max-field-of-view="42deg" data-js-focus-visible=""
                    ar-status="not-presenting">
        <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
        </div>
      </model-viewer>
      <span>matchbox open by Justin Randall [CC-BY] via Poly Pizza</span>
    </button>
    <button id="reset">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="icon icon-tabler icons-tabler-outline icon-tabler-refresh">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
        <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
      </svg>
    </button>
    <a href="https://github.com/Kizjkre/8-objects" id="github" target="life-events">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           class="icon icon-tabler icons-tabler-outline icon-tabler-brand-github">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path
          d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" />
      </svg>
    </a>
  </body>
</html>
